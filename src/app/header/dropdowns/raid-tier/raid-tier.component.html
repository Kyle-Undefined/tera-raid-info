<label for="raidTier">Raid tier</label>
<select
	#select
	id="raidTier"
	[ngModel]="state.selection().tier"
	(ngModelChange)="valueChanged($event)"
>
	<option value="">Choose raid tier</option>
	@for (option of options; track option) {
		<option [value]="option">{{ option + ' ★' }}</option>
	}
</select>
